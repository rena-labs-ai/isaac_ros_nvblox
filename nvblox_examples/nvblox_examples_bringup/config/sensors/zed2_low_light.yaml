# ZED 2 / ZED 2i — low light overlay (zed_common + zed2 loaded first).
#
# Based on cuVSLAM troubleshooting: sharp, lower-noise input; tune FPS, brightness/contrast/gamma,
# auto exposure, and denoising where applicable. See:
# https://github.com/nvidia-isaac/cuVSLAM/blob/main/TROUBLESHOOTING.md
#
# Step 3: Lower grab/publish rate vs. stock 60 Hz — trades temporal rate for more integration per
#         frame (helps blur vs. brightness in dim scenes). Re-verify motion if tracking drops frames.
# Step 5: Feed rectified images to VSLAM (e.g. /zed/zed_node/rgb/image_rect_color), not raw.
# Step 4 / img masks: Static-ROI masking is cuVSLAM / Isaac ROS (img_mask_*), not set here.
# Step 8: enable_image_denoising on Isaac ROS visual_slam is separate from ZED video.denoising;
#         enable both only if needed — too much blur can hurt corners.
#
# Launch: zed_lighting:=low_light
---
/**:
    ros__parameters:
        general:
            grab_frame_rate: 60
            pub_frame_rate: 60.0
        video:
            # Step 8 — brightness / contrast / gamma (defaults in zed_common are 4 / 4 / 8)
            brightness: 5
            contrast: 4
            gamma: 8
            # Prerequisite — sharp images for feature stability
            sharpness: 5
            auto_exposure_gain: true
            auto_whitebalance: true
            # whitebalance_temperature: 29
            # Step 5 / 8 — SDK ISP denoising [0–100]; parallel to Odometry.Config.use_denoising in cuVSLAM
            denoising: 50
